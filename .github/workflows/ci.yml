name: CI - Sistema de Citas (Backend & Frontend)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: "Backend - Compilación y Tests Unitarios (Spring Boot)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Sistema-citas

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Test Backend
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean test
          else
            mvn clean test
          fi

  frontend-ci:
    name: "Frontend - Dependencias y Build de Producción (React + Vite)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Sistema-citas/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Sistema-citas/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
