server.port=8080

# ==========================================
# CONFIGURACION DE CONEXION A POSTGRESQL (Docker)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/citasdb
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION DE HIBERNATE / JPA
# ==========================================
# Dialecto especifico para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto=update: Hibernate analiza las entidades JPA (@Entity) al arrancar la aplicacion
# y crea o actualiza automaticamente las tablas y columnas en PostgreSQL durante el desarrollo,
# facilitando iteraciones rapidas sin perder datos existentes.
spring.jpa.hibernate.ddl-auto=update

# Mostrar y formatear consultas SQL en la consola para auditoria y depuracion
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nota: Se han retirado las propiedades de la consola H2 de desarrollo (spring.h2.console.*)
# ya que la persistencia principal del sistema se ha migrado exitosamente al contenedor de PostgreSQL.
