name: CI - Sistema de Citas (Backend & Frontend)

# ==========================================
# 1. DISPARADORES (TRIGGERS)
# ==========================================
# El pipeline se ejecuta automáticamente ante cada push o pull request dirigido a las ramas principales.
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ==========================================
  # 2. JOB 1: BACKEND (SPRING BOOT)
  # ==========================================
  backend-ci:
    name: "Backend - Compilación y Tests Unitarios (Spring Boot)"
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repositorio en el runner de GitHub Actions
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Paso 2: Configurar el entorno Java JDK 21 con Temurin y caché de Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Paso 3: Dar permisos de ejecución al Maven Wrapper y ejecutar compilación y tests
      - name: Build and Test Backend
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean test
          else
            mvn clean test
          fi

    # ¿Por qué es crucial correr los tests automatizados en un entorno limpio antes de mergear cambios?
    # - Entorno Limpio (Efeméride): Garantiza que el código no dependa de configuraciones locales ocultas, 
    #   asegurando que compila y pasa todas las pruebas unitarias en una máquina fresca idéntica a producción.
    # - Prevención de Regresiones: Evita que se introduzcan bugs o fallos de compilación en ramas compartidas,
    #   actuando como una red de seguridad automática para el equipo de desarrollo.

  # ==========================================
  # 3. JOB 2: FRONTEND (REACT + VITE)
  # ==========================================
  frontend-ci:
    name: "Frontend - Dependencias y Build de Producción (React + Vite)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Paso 2: Configurar Node.js versión 20 con caché de NPM
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Paso 3: Instalar dependencias estrictas con npm ci
      - name: Install Dependencies
        run: npm ci

      # Paso 4: Generar el bundle de producción para verificar errores de compilación o sintaxis
      - name: Build Frontend
        run: npm run build

    # ¿Por qué "npm ci" es más estricto y predecible que "npm install" en pipelines de CI?
    # - npm ci (Clean Install) está diseñado específicamente para entornos automatizados de integración continua.
    # - A diferencia de npm install (que puede modificar package-lock.json si detecta discrepancias), 
    #   npm ci instala exactamente las versiones exactas especificadas en package-lock.json y falla 
    #   si el archivo lock no está sincronizado con package.json.
    # - Además, borra el directorio node_modules antes de instalar, garantizando un entorno 100% limpio y reproducible.
