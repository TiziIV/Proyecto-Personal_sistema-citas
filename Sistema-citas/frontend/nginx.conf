server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Configuración esencial para SPAs (Single Page Applications) como React Router
    # Si la ruta solicitada no corresponde a un archivo estático físico (como JS, CSS o imágenes),
    # Nginx redirige todas las peticiones a index.html para que el enrutador de React gestione las vistas.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuración de caché opcional para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
